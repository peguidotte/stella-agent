[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stella-agent"
version = "1.0.0"
description = "Assistente Inteligente para Gerenciamento de Almoxarifado com reconhecimento facial e comandos de voz"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Stellar Team - DASA Challenge FIAP"}
]
keywords = ["ai", "voice-assistant", "face-recognition", "healthcare", "inventory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deepface==0.0.92",
    "opencv-python>=4.5.0,<5.0.0",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    "loguru==0.7.3",
    "pytest==8.4.1",
    "fastapi",
    "uvicorn",
    "pika==1.3.2",
    "pusher==3.3.3",
    "google-generativeai>=0.8.0",
    "spacy>=3.7.0",
    "numpy>=1.25.2,<2.0.0",
    "protobuf>=4.25.3,<5.0.0",
    "transformers",
    "torch",
    "requests",
    "httpx>=0.27.0",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/peguidotte/stella-agent"
Repository = "https://github.com/peguidotte/stella-agent"
Issues = "https://github.com/peguidotte/stella-agent/issues"

[tool.setuptools]
packages = ["stella"]

[tool.setuptools.package-data]
stella = ["config/*.yaml", "data/*.json"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["stella"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "deepface.*",
    "cv2.*",
    "pusher.*",
    "pika.*",
    "transformers.*",
    "torch.*",
    "spacy.*",
]
ignore_missing_imports = true
